<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omega - Fortnite Accounts</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top, #2b170a, #06030e);
      color: #ffffff;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      padding: 20px;
    }
    .nav-header { max-width: 1100px; margin: 0 auto 30px; }
    .back-btn {
      color: #f97316;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.1rem;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: 0.3s;
    }
    .back-btn:hover { color: #fb923c; transform: translateX(-5px); }
    
    .card-container {
      max-width: 1100px;
      margin: 0 auto;
      background: rgba(38, 20, 10, 0.7);
      border: 1px solid rgba(249, 115, 22, 0.4);
      border-radius: 24px;
      padding: 40px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      box-shadow: 0 0 50px rgba(249, 115, 22, 0.2);
      backdrop-filter: blur(10px);
    }
    @media (max-width: 768px) { .card-container { grid-template-columns: 1fr; padding: 20px; } }
    
    .skin-preview {
      background: radial-gradient(circle, rgba(249, 115, 22, 0.25) 0%, rgba(30, 15, 7, 0.8) 70%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      border: 1px solid rgba(249, 115, 22, 0.3);
    }
    .skin-preview img {
      max-width: 100%;
      height: 380px;
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(249, 115, 22, 0.6));
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      background: rgba(249, 115, 22, 0.2);
      color: #fb923c;
      border: 1px solid #f97316;
      margin-bottom: 10px;
    }
    h1 { font-family: 'Teko', sans-serif; font-size: 3.8rem; text-transform: uppercase; line-height: 1; }
    .subtitle { color: #f97316; font-weight: 700; letter-spacing: 1px; margin-bottom: 25px; }
    
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 30px;
    }
    .stat-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 18px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .stat-box i { font-size: 1.4rem; color: #f97316; }
    .stat-val { font-size: 1.2rem; font-weight: 700; }
    .stat-lbl { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; }

    .price-action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 25px;
    }
    .price { font-family: 'Teko', sans-serif; font-size: 3.5rem; color: #fb923c; }
    .buy-btn {
      background: linear-gradient(135deg, #f97316, #c2410c);
      color: white;
      padding: 16px 36px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.2rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(249, 115, 22, 0.5);
      transition: 0.3s;
    }
    .buy-btn:hover { transform: translateY(-3px); box-shadow: 0 0 35px rgba(249, 115, 22, 0.8); }
  </style>
</head>
<body>
  <div class="nav-header">
    <a href="ai.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> TERUG NAAR OVERZICHT</a>
  </div>
  <div class="card-container">
    <div class="skin-preview">
      <img src="https://fortnite-api.com/images/cosmetics/br/cid_142_athena_commando_m_omega/icon.png" alt="Omega">
    </div>
    <div>
      <span class="badge">04 • EPIC</span>
      <h1>OMEGA</h1>
      <div class="subtitle">INFERNO SERIES</div>
      <div class="stats-grid">
        <div class="stat-box"><i class="fa-solid fa-shield"></i><div><div class="stat-val">220</div><div class="stat-lbl">Level</div></div></div>
        <div class="stat-box"><i class="fa-solid fa-shirt"></i><div><div class="stat-val">180</div><div class="stat-lbl">Skins</div></div></div>
        <div class="stat-box"><i class="fa-solid fa-v"></i><div><div class="stat-val">1,180</div><div class="stat-lbl">V-Bucks</div></div></div>
        <div class="stat-box"><i class="fa-solid fa-trophy"></i><div><div class="stat-val">190</div><div class="stat-lbl">Wins</div></div></div>
      </div>
      <div class="price-action">
        <div class="price">€ 40,00</div>
        <button class="buy-btn">KOOP NU</button>
      </div>
    </div>
  </div>
</body>
</html>
